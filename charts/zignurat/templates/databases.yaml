{{- range $name, $app := .Values.apps }}
{{- $db := printf "%s-db" $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $db }}-init
data:
{{ ($.Files.Glob (printf "files/%s/*.sql" $db)).AsConfig | indent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}
spec:
  clusterIP: None
  selector:
    app: {{ $db }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db }}
spec:
  serviceName: {{ $db }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ $db }}
  template:
    metadata:
      labels:
        app: {{ $db }}
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $app.db.name | quote }}
            - name: POSTGRES_USER
              value: {{ $app.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ upper $name }}_DB_PW
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $app.db.user | quote }}, "-d", {{ $app.db.name | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ $db }}-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $app.db.storage }}
{{- end }}
