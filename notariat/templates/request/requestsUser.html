<div class="flex items-center mb-6">
    <div class="flex-1">
        <button hx-get="/index" hx-trigger="click" hx-target="#content-div" hx-swap="innerHTML"
            class="bg-gray-500 hover:bg-gray-400 py-2 px-4 mx-2 border-b-4 border-gray-700 hover:border-gray-500 rounded text-sm text-white font-bold ">
            Inicio </button>
    </div>
    <div class="flex-none">
        <h1 class="text-2xl font-bold text-gray-700 text-center"> Buscar Solicitudes Realizadas </h1>
    </div>
    <div class="flex-1">
        <form hx-get="/requestCertificate" hx-trigger="click" hx-target="#content-div" hx-swap="innerHTML">
            <button type="submit"
                class="float-right bg-green-500 hover:bg-green-400 py-2 px-4 mx-2 border-b-4 border-green-600 hover:border-green-400 rounded text-sm text-white font-bold">
                Nueva Solicitud </button>
        </form>
    </div>
</div>
<div class="w-full flex justify-center my-6">
    <form hx-post="/getRequestsByMail" hx-target="#table-content" hx-trigger="submit" hx-swap="outerHTML">
    <div class="w-full flex items-center bg-gray-100 p-4 shadow-md">
        <!-- Mail -->
        <div class="mx-2">
            <div class="w-full min-w-m relative">
                <div class="relative">
                    <label for="mail"
                        class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2"> Mail </label>
                    <input id="mail" name="mail" type="text" placeholder="Escribir..."
                       class="bg-white w-full pr-11 h-10 pl-3 py-2 placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-400 shadow-sm focus:shadow-md"/>
                </div>
            </div>
        </div>
        <!-- Button -->
        <div class="mx-2 mt-6">
            <div class="container flex justify-center">
                <div class="flex flex-row mx-auto">
                    <button type="submit"
                        class="py-2 px-4 mx-2 bg-sky-400 hover:bg-sky-500 border-b-4 border-sky-600 hover:border-sky-600 rounded text-sm text-white font-bold ">
                        <div class="flex flex-row mx-auto">
                            <div>
                                <p class="mr-2">Buscar</p>
                            </div>
                            <div>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="4" stroke="white" class="mt-1 w-3 h-3 text-slate-600">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                                </svg>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
{{template "requestTable" .}}
